      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        var key = "blog-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body data-page="project">
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <nav class="nav" aria-label="主导航">

          <li><a href="index.html" data-nav="home">首页</a></li>
          <li><a href="about.html" data-nav="about">关于</a></li>
          <li><a href="project.html" data-nav="project">项目</a></li>

        <button class="icon-btn menu-btn" id="menu-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="打开菜单">

        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题">
          <span class="sun" aria-hidden="true">☀</span>
          <span class="moon" aria-hidden="true">☾</span>
        </button>

    <main id="main">

    <footer class="site-footer">
